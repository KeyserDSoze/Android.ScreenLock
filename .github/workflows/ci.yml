name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-lock-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android 37 SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Generate ephemeral CI signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt             -keystore "$RUNNER_TEMP/ci-signing.jks"             -storetype JKS             -alias screenlock             -keyalg RSA             -keysize 2048             -validity 2             -storepass ci-only-password             -keypass ci-only-password             -dname "CN=Screen Lock CI"

      - name: Test and compile APK + App Bundle
        working-directory: src
        env:
          SCREENLOCK_KEYSTORE_PATH: ${{ runner.temp }}/ci-signing.jks
          SCREENLOCK_KEYSTORE_PASSWORD: ci-only-password
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease

      - name: Verify CI signatures
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs src/app/build/outputs/apk/debug/app-debug.apk
          jarsigner -verify -verbose -certs src/app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Verify Play-safe manifest
        shell: bash
        run: |
          MANIFEST="$(find src/app/build/intermediates -path '*/release/*' -name AndroidManifest.xml -type f | grep -E '/merged_manifest|/merged_manifests|/packaged_manifests' | head -n 1)"
          if [[ -z "$MANIFEST" || ! -f "$MANIFEST" ]]; then
            echo "Could not locate merged release AndroidManifest.xml" >&2
            find src/app/build/intermediates -name AndroidManifest.xml -type f | sort
            exit 1
          fi
          echo "Checking Play manifest: $MANIFEST"
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$MANIFEST"; then
            echo "Play build must not request REQUEST_INSTALL_PACKAGES" >&2
            exit 1
          fi
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "Play build must not request INTERNET" >&2
            exit 1
          fi
          if grep -q 'ShadeProtectionAccessibilityService' "$MANIFEST"; then
            echo "Play build must not include ShadeProtectionAccessibilityService" >&2
            exit 1
          fi
          echo "Play manifest policy surface OK"
