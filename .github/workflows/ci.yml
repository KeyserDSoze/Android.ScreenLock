name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-lock-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android 37 SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Generate ephemeral CI signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt             -keystore "$RUNNER_TEMP/ci-signing.jks"             -storetype JKS             -alias screenlock             -keyalg RSA             -keysize 2048             -validity 2             -storepass ci-only-password             -keypass ci-only-password             -dname "CN=Screen Lock CI"

      - name: Test and compile
        working-directory: src
        env:
          SCREENLOCK_KEYSTORE_PATH: ${{ runner.temp }}/ci-signing.jks
          SCREENLOCK_KEYSTORE_PASSWORD: ci-only-password
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify CI APK signature
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs             src/app/build/outputs/apk/debug/app-debug.apk
