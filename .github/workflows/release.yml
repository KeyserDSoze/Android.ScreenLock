name: Release APK

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screen-lock-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure version is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump VERSION before releasing." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android 37 SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Restore stable signing key
        shell: bash
        env:
          SCREENLOCK_KEYSTORE_B64: ${{ secrets.SCREENLOCK_KEYSTORE_B64 }}
        run: |
          if [[ -z "$SCREENLOCK_KEYSTORE_B64" ]]; then
            echo "Missing repository secret SCREENLOCK_KEYSTORE_B64" >&2
            exit 1
          fi
          printf '%s' "$SCREENLOCK_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/screenlock-release.jks"

      - name: Test and build APK + Play App Bundle
        working-directory: src
        env:
          SCREENLOCK_KEYSTORE_PATH: ${{ runner.temp }}/screenlock-release.jks
          SCREENLOCK_KEYSTORE_PASSWORD: ${{ secrets.SCREENLOCK_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$SCREENLOCK_KEYSTORE_PASSWORD" ]]; then
            echo "Missing repository secret SCREENLOCK_KEYSTORE_PASSWORD" >&2
            exit 1
          fi
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease

      - name: Verify release signatures
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs src/app/build/outputs/apk/debug/app-debug.apk
          jarsigner -verify -verbose -certs src/app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Verify Play-safe manifest
        shell: bash
        run: |
          MANIFEST="$(find src/app/build/intermediates -path '*/release/*' -name AndroidManifest.xml -type f | grep -E '/merged_manifest|/merged_manifests|/packaged_manifests' | head -n 1)"
          if [[ -z "$MANIFEST" || ! -f "$MANIFEST" ]]; then
            echo "Could not locate merged release AndroidManifest.xml" >&2
            find src/app/build/intermediates -name AndroidManifest.xml -type f | sort
            exit 1
          fi
          echo "Checking Play manifest: $MANIFEST"
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$MANIFEST"; then
            echo "Play build must not request REQUEST_INSTALL_PACKAGES" >&2
            exit 1
          fi
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "Play build must not request INTERNET" >&2
            exit 1
          fi
          if grep -q 'ShadeProtectionAccessibilityService' "$MANIFEST"; then
            echo "Play build must not include ShadeProtectionAccessibilityService" >&2
            exit 1
          fi
          echo "Play manifest policy surface OK"

      - name: Prepare release files
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SCREENLOCK_KEYSTORE_PASSWORD: ${{ secrets.SCREENLOCK_KEYSTORE_PASSWORD }}
        run: |
          APK="screen-lock-v${VERSION}.apk"
          AAB="screen-lock-v${VERSION}.aab"
          CERT="screen-lock-upload-cert.pem"
          cp src/app/build/outputs/apk/debug/app-debug.apk "$APK"
          cp src/app/build/outputs/bundle/release/app-release.aab "$AAB"
          sha256sum "$APK" > "$APK.sha256"
          sha256sum "$AAB" > "$AAB.sha256"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" > "$APK.cert.txt"
          keytool -exportcert -rfc \
            -keystore "$RUNNER_TEMP/screenlock-release.jks" \
            -storepass "$SCREENLOCK_KEYSTORE_PASSWORD" \
            -alias screenlock \
            -file "$CERT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.artifact.outputs.apk }}
          AAB: ${{ steps.artifact.outputs.aab }}
          CERT: ${{ steps.artifact.outputs.cert }}
        run: |
          gh release create "$TAG" \
            "$APK" "$APK.sha256" "$APK.cert.txt" \
            "$AAB" "$AAB.sha256" "$CERT" \
            --target "$GITHUB_SHA" \
            --title "Screen Lock $VERSION" \
            --generate-notes

  publish-play-internal:
    needs: release
    if: ${{ vars.GOOGLE_PLAY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: google-play

    steps:
      - name: Download signed App Bundle from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "screen-lock-*.aab" \
            --pattern "screen-lock-*.aab.sha256" \
            --dir dist

      - name: Verify App Bundle checksum
        working-directory: dist
        run: sha256sum --check screen-lock-*.aab.sha256

      - name: Prepare Play release notes
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir -p distribution/whatsnew
          printf 'Screen Lock %s: improvements, fixes and updated localization.\n' "$VERSION" > distribution/whatsnew/whatsnew-en-US
          printf 'Screen Lock %s: miglioramenti, correzioni e localizzazione aggiornata.\n' "$VERSION" > distribution/whatsnew/whatsnew-it-IT

      - name: Upload to Google Play Internal testing
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.keysersoze.screenlock
          releaseFiles: dist/screen-lock-v${{ needs.release.outputs.version }}.aab
          tracks: ${{ vars.GOOGLE_PLAY_AUTO_TRACKS || 'internal' }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
