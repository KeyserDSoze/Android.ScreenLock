name: Release APK

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screen-lock-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure version is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump VERSION before releasing." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android 37 SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Restore stable signing key
        shell: bash
        env:
          SCREENLOCK_KEYSTORE_B64: ${{ secrets.SCREENLOCK_KEYSTORE_B64 }}
        run: |
          if [[ -z "$SCREENLOCK_KEYSTORE_B64" ]]; then
            echo "Missing repository secret SCREENLOCK_KEYSTORE_B64" >&2
            exit 1
          fi
          printf '%s' "$SCREENLOCK_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/screenlock-release.jks"

      - name: Test and build installable APK
        working-directory: src
        env:
          SCREENLOCK_KEYSTORE_PATH: ${{ runner.temp }}/screenlock-release.jks
          SCREENLOCK_KEYSTORE_PASSWORD: ${{ secrets.SCREENLOCK_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$SCREENLOCK_KEYSTORE_PASSWORD" ]]; then
            echo "Missing repository secret SCREENLOCK_KEYSTORE_PASSWORD" >&2
            exit 1
          fi
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs             src/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release files
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK="screen-lock-v${VERSION}.apk"
          cp src/app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" > "$APK.cert.txt"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.artifact.outputs.apk }}
        run: |
          gh release create "$TAG" \
            "$APK" "$APK.sha256" "$APK.cert.txt" \
            --target "$GITHUB_SHA" \
            --title "Screen Lock $VERSION" \
            --generate-notes
